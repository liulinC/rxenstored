[package]
name = "xs-daemon"
description = "rxenstored: the xenstore daemon (event loop over xs-core)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# The event loop is a library so that tests can run it in-process over the
# simulated backend; the binary is a thin user of it.
[lib]
name = "xs_daemon"
path = "src/lib.rs"

[[bin]]
name = "rxenstored"
path = "src/main.rs"

[dependencies]
xs-core = { path = "../xs-core" }
xs-sys = { path = "../xs-sys" }
xs-wire = { path = "../xs-wire" }

[dev-dependencies]
libc = "0.2"
xs-bench = { path = "../xs-bench" }
xs-sim = { path = "../xs-sim" }
xs-diff = { path = "../xs-diff" }

[lints]
workspace = true
